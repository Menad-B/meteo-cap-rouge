name: Meteo quotidienne Cap-Rouge

on:
  schedule:
    # 11:00 UTC = 7:00 du matin au Québec en été (HAE).
    # En hiver (HNE), remplace par "0 12 * * *" pour rester à 7:00.
    - cron: "0 11 * * *"
  workflow_dispatch:   # permet aussi de lancer le robot manuellement (bouton)

jobs:
  envoyer-meteo:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Envoyer le courriel météo
        env:
          EMAIL_EXPEDITEUR: ${{ secrets.EMAIL_EXPEDITEUR }}
          EMAIL_MOT_DE_PASSE: ${{ secrets.EMAIL_MOT_DE_PASSE }}
          EMAIL_DESTINATAIRE: ${{ secrets.EMAIL_DESTINATAIRE }}
        run: python weather_email.py
